name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked project dependencies
        run: uv sync --all-groups --locked
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Build documentation and distributions
        run: |
          uv run mkdocs build --strict
          uv run python -m build
      - name: Scan current source for credential exposure
        run: uv run python scripts/quality/secret_scan.py
      - name: Tests with coverage
        run: uv run pytest --cov=prescriptxai --cov-report=xml --cov-report=json --cov-report=term-missing
      - name: Scoped line and full-package coverage gates
        run: uv run python scripts/quality/coverage_gate.py --output coverage-gate.json
      - name: Upload complete coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.json
            coverage-gate.json
          if-no-files-found: error
      - name: Audit installed dependency advisories
        if: matrix.python-version == '3.12'
        run: uv run pip-audit --path .venv/lib/python3.12/site-packages --format json --output dependency-audit.json
      - name: Upload dependency audit
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: warn
