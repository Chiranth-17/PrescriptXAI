- name: engine_id
  label: Engine unit identifier
  unit: identifier
  cmapss_column: unit_id
  group: context
  bounds:
    minimum: 1.0
    maximum: 1000.0
    source: manual
  max_rate_of_change: null
  direction: any
- name: cycle
  label: Within-engine cycle index
  unit: cycle
  cmapss_column: cycle
  group: context
  bounds:
    minimum: 1.0
    maximum: 10000.0
    source: manual
  max_rate_of_change: null
  direction: any
coupling_rules:
- name: p30_above_ps30
  feature_a: sensor_7
  feature_b: sensor_11
  relation: greater_than
  tolerance: 0.0
- name: t24_below_t30
  feature_a: sensor_2
  feature_b: sensor_3
  relation: less_than
  tolerance: 0.0
- name: t30_above_t50
  feature_a: sensor_3
  feature_b: sensor_4
  relation: greater_than
  tolerance: 0.0
