schema_version: 2
dataset: CMAPSS
bound_estimation:
  lower_percentile: 1.0
  upper_percentile: 99.0
  margin_fraction: 0.02
  degenerate_half_width: 1.0e-06
# Controllable proxy rate limits use the train-engine-only 99th percentile of absolute
# within-engine cycle-to-cycle telemetry changes. They are empirical proxy limits, not measured
# actuator slew rates; the fitted raw-unit values are saved with model and coupling artifacts.
coupling:
  backend: ridge
  residual_sigma_k: 3.0
  min_r2: 0.35
  min_rul_cycles: 30
  artifact_name: '{subset}-coupling.joblib'
  ridge_alpha: 1.0
  gradient_boosting_estimators: 100
  gradient_boosting_max_depth: 3
  gradient_boosting_learning_rate: 0.05
  mlp_hidden_dims: [32, 16]
  mlp_max_iter: 500
  mlp_learning_rate: 0.001
  cross_validation_folds: 5
  torch_hidden_dims:
  - 32
  - 16
  torch_epochs: 250
  torch_learning_rate: 0.001
features:
- name: op_setting_1
  label: Normalized altitude setting
  unit: normalized
  cmapss_column: op_setting_1
  group: immutable_operational
  bounds:
    minimum: null
    maximum: null
    source: training_percentiles
  max_rate_of_change: null
  direction: any
- name: op_setting_2
  label: Normalized Mach number setting
  unit: normalized
  cmapss_column: op_setting_2
  group: immutable_operational
  bounds:
    minimum: null
    maximum: null
    source: training_percentiles
  max_rate_of_change: null
  direction: any
- name: op_setting_3
  label: Throttle resolver angle (TRA)
  unit: degrees
  cmapss_column: op_setting_3
  group: immutable_operational
  bounds:
    minimum: null
    maximum: null
    source: training_percentiles
  max_rate_of_change: null
  direction: any
- name: sensor_1
  label: Total temperature at fan inlet (T2)
  unit: degR
  cmapss_column: s1
  group: dependent
  bounds:
    minimum: null
    maximum: null
    source: training_percentiles
  max_rate_of_change: null
  direction: any
- name: sensor_2
  label: Total temperature at LPC outlet (T24)
