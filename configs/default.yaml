seed: 1729
artifacts:
  model: artifacts/FD001-xgboost.joblib
  mahalanobis: artifacts/FD001-mahalanobis.joblib
  evaluation_report: artifacts/FD001-evaluation.json
api:
  host: 127.0.0.1
  port: 8000
data:
  root: data/raw
  archive_name: CMAPSSData.zip
  processed_root: data/processed
  dataset: FD001
