  torch_batch_size: 128
  torch_device: cpu
recourse:
  max_changed_features: 3
  max_scaled_distance: 4.0
  prediction_weight: 10.0
  max_iterations: 500
  solver_ftol: 0.000000001
  safety_margin: 0.005
validation:
  mahalanobis_max: 5.0
  covariance_regularization: 0.000001
  simulator_enabled: false
evaluation:
  random_seed: 1729
  max_queries: 100
  recourse_validity_rate: 0.95
  physical_plausibility_rate: 0.90
  average_sparsity_max: 3
  mean_risk_drop_min: 0.60
