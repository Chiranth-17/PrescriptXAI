process_isolation: Each side/policy executes in a fresh child interpreter; native unsets MKL_CBWR, compatible
  sets MKL_CBWR=COMPATIBLE BEFORE importing torch/numpy. Both set MKL_VERBOSE=1 for actual BLAS diagnostics.
  Other environment values are inherited and recorded. No parent/global environment change; no old environment/package
  mutation.
controls_policy: Native on each OS must exactly reproduce all previous native surrogate scores, gradients,
  architecture, parameter hashes and complete operation traces, or stop interpretation. Every policy requires
  exact repeated results and exact traced/public forward/backward chain. Compatible output changes are
  recorded, never silently treated as reproducing old controls.
points: Original fixed scaled vectors and per-layer original Windows operands from completed operator
  probe. Retain native and common-input forward outputs and all-ones VJPs. Every raw row retained, including
  differences from original native values.
comparison: Compare native-to-native, compatible-to-compatible across OS and each compatible arm to its
  original native controls. Record every differing operation and numeric maximum; no accepted differences
  or adjusted tolerance.
rationale: Actual CPU is AMD. Official Intel guidance supports AUTO and COMPATIBLE modes for non-Intel
  CPUs. PyTorch does not promise identical results across platforms; mode consistency is a focused hypothesis,
  not an asserted repair. Native linkage inspection finds MKL symbols defined inside libtorch_cpu.so with
  no dynamic MKL dependency.
