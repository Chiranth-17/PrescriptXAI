interpretation: If compatible outputs agree across OS but differ from historical Windows native controls,
  it is only evidence about a possible future policy, not a repair preserving the approved baseline. No
  search/gate authorized by such agreement. If they remain different, retain the negative result and reject
  the mode-only fix. No threshold/model/precision/kernel source/config input/population/known-diff edits.
scope: Selected fixed-operation diagnostic, not latency, regression approval, generalization or physical
  efficacy evidence. Original volumes/input files read-only.
