schema_version: 1
limits_status: demonstration
machine_id: cmapss_fd001
display_name: NASA C-MAPSS FD001 (simulated turbofan)
unit_word: engine
unit_plural: engines
data_source: https://phm-datasets.s3.amazonaws.com/NASA/6.+Turbofan+Engine+Degradation+Simulation+Data+Set.zip
license_note: NASA public benchmark. Consult the source for terms. The archive is provisioned separately.
synthetic: true
dataset:
  adapter: cmapss
  path: data/raw/CMAPSSData.zip
  unit_column: unit_id
  time_column: cycle
  subset: FD001
  split_fractions:
  - 0.7
  - 0.15
  - 0.15
  lifetime_buckets: 6
features:
- id: op_setting_1
  label: Normalized altitude setting
  unit: normalized
  column: op_setting_1
  role: frozen
  legacy_group: immutable_operational
  bounds:
    minimum: null
    maximum: null
    source: training_percentiles
  step_limit: null
  direction: any
  why: Observed input held fixed during the search.
- id: op_setting_2
  label: Normalized Mach number setting
  unit: normalized
  column: op_setting_2
  role: frozen
  legacy_group: immutable_operational
  bounds:
    minimum: null
    maximum: null
    source: training_percentiles
  step_limit: null
  direction: any
  why: Observed input held fixed during the search.
- id: op_setting_3
