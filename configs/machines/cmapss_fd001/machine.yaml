- id: engine_id
  label: Engine unit identifier
  unit: identifier
  column: unit_id
  role: frozen
  legacy_group: context
  bounds:
    minimum: 1.0
    maximum: 1000.0
    source: manual
  step_limit: null
  direction: any
  why: Observed input held fixed during the search.
- id: cycle
  label: Within-engine cycle index
  unit: cycle
  column: cycle
  role: frozen
  legacy_group: context
  bounds:
    minimum: 1.0
    maximum: 10000.0
    source: manual
  step_limit: null
  direction: any
  why: Observed input held fixed during the search.
failure:
  horizon: 30
  label_source: run_to_failure
  tau_safe: 0.2
  tau_danger: 0.8
validation:
  plausibility:
    v1: 5.0
    v2: 8.0
  coupling_rules:
  - name: p30_above_ps30
    feature_a: sensor_7
    feature_b: sensor_11
    relation: greater_than
    tolerance: 0.0
  - name: t24_below_t30
    feature_a: sensor_2
    feature_b: sensor_3
    relation: less_than
    tolerance: 0.0
  - name: t30_above_t50
    feature_a: sensor_3
    feature_b: sensor_4
    relation: greater_than
    tolerance: 0.0
  fitted_coupling:
    backend: ridge
    residual_sigma_k: 3.0
    min_r2: 0.35
    min_rul_cycles: 30
    artifact_name: '{subset}-coupling.joblib'
    ridge_alpha: 1.0
    gradient_boosting_estimators: 100
    gradient_boosting_max_depth: 3
    gradient_boosting_learning_rate: 0.05
    mlp_hidden_dims:
    - 32
    - 16
    mlp_max_iter: 500
    mlp_learning_rate: 0.001
    cross_validation_folds: 5
    torch_hidden_dims:
    - 32
    - 16
    torch_epochs: 250
    torch_learning_rate: 0.001
  bound_estimation:
    lower_percentile: 1.0
    upper_percentile: 99.0
    margin_fraction: 0.02
    degenerate_half_width: 1.0e-06
  rate_assumption: Train-unit-only 99th percentile of absolute one-cycle change in a telemetry proxy.
  intervention_steps: 1
quality:
  max_time_gap: 1
  stuck_window: 5
  stuck_tolerance: 0
  stuck_features: []
delta_min: 0.3
k_max: 3
latency_budgets:
  FAST:
    ingestion_max_ms: 10
    inference_max_ms: 15
    optimization_min_ms: 1200
    optimization_max_ms: 1800
    validation_max_ms: 100
    dashboard_max_ms: 250
    pipeline_min_ms: 1500
    pipeline_max_ms: 2200
  THOROUGH:
    ingestion_max_ms: 10
    inference_max_ms: 15
    optimization_min_ms: 1200
    optimization_max_ms: 1800
    validation_max_ms: 100
    dashboard_max_ms: 250
    pipeline_min_ms: 1500
    pipeline_max_ms: 2200
confirmation:
  confirmed_by: null
  role: null
  confirmed_on: null
sentences:
  increase: Increase {label} by {amount} {unit}. {why}
  decrease: Decrease {label} by {amount} {unit}. {why}
  escalation: Schedule maintenance and obtain domain review before intervention.
