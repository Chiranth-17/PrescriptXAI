[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "prescriptxai"
version = "0.1.0"
description = "Physically constrained algorithmic recourse for prescriptive maintenance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2,<2.5",
  "pandas>=2.2,<4",
  "scipy>=1.15,<2",
  "scikit-learn>=1.6,<2",
  "xgboost>=2.1,<4",
  "torch>=2.6,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "plotly>=6.0,<7",
  "streamlit>=1.43,<2",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "hypothesis>=6.125,<7",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-PyYAML>=6.0.12,<7",
  "pandas-stubs>=2.2,<4",
  "pre-commit>=4.1,<5",
  "pip-tools>=7.4,<8",
  "httpx2>=2,<3",
]

[project.scripts]
prescriptxai = "prescriptxai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/prescriptxai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["prescriptxai"]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "D", "SIM"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"src/prescriptxai/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["prescriptxai"]
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["numpy.*", "scipy.*", "sklearn.*", "plotly.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["joblib"]
ignore_missing_imports = true
