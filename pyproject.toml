[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "prescriptxai"
version = "0.2.0"
description = "Physically constrained algorithmic recourse for prescriptive maintenance"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "PrescriptXAI contributors"}]
dependencies = [
  "numpy==2.4.6",
  "pandas==3.0.6",
  "scipy==1.17.1; python_version < '3.12'",
  "scipy==1.18.1; python_version >= '3.12'",
  "scikit-learn==1.9.1",
  "threadpoolctl==3.7.0",
  "xgboost==3.1.2",
  "torch==2.14.1",
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "typer==0.27.2",
  "pillow==13.0.0",
  "joblib==1.6.0",
  "plotly==6.9.0",
  "certifi==2026.10.23",
  "filelock==4.2.4",
]

[project.optional-dependencies]
api = ["fastapi==0.142.2", "starlette==1.7.0", "uvicorn==0.54.0"]
dashboard = ["plotly==6.9.0", "streamlit==1.66.1", "opentelemetry-api==1.45.1"]
baselines = ["dice-ml==0.12", "lightgbm==4.7.0", "raiutils==0.4.2", "tqdm==4.70.1"]

[dependency-groups]
core = []
docs = ["mkdocs-material==9.8.0", "mkdocstrings[python]==1.0.8", "mkdocstrings-python==2.0.10", "matplotlib==3.11.2"]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "hypothesis==6.168.3",
  "ruff==0.16.10",
  "mypy==1.20.2",
  "types-PyYAML==6.0.12.20260906",
  "pandas-stubs==3.0.5.260914",
  "pre-commit==4.6.2",
  "httpx2==2.13.1",
  "pip-audit==2.10.1",
  "psutil==7.2.2",
  "build==1.6.1",
]
dashboard = ["plotly==6.9.0", "streamlit==1.66.1"]
api = ["fastapi==0.142.2", "uvicorn==0.54.0"]
baselines = [
    "dice-ml==0.12",
    "lightgbm==4.7.0",
    "raiutils==0.4.2",
    "tqdm==4.70.1",
]

[tool.uv]
default-groups = ["core", "dev", "dashboard", "api", "baselines"]
constraint-dependencies = [
  "certifi==2026.10.23",
  "filelock==4.2.4",
  "opentelemetry-api==1.45.1",
  "setuptools==84.2.1",
  "virtualenv==21.14.13",
]

[project.scripts]
prescriptxai = "prescriptxai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/prescriptxai"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/configs", "/docs", "/paper", "/scripts", "/README.md", "/CHANGELOG.md", "/LICENSE", "/CITATION.cff", "/VERSION", "/pyproject.toml", "/uv.lock", "/Makefile", "/mkdocs.yml", "/Dockerfile", "/docker-compose.yml", "/.dockerignore", "/hatch_build.py"]

[tool.hatch.build.targets.wheel.force-include]
"src/prescriptxai/py.typed" = "prescriptxai/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "slow: longer profiling, process, or stress verification",
  "e2e: complete temporary-directory system workflow",
  "gpu: optional GPU-specific verification when GPU hardware is present",
]

[tool.coverage.run]
branch = true
source = ["prescriptxai"]

[tool.coverage.report]
show_missing = true
fail_under = 86.07837763770897
precision = 12

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "D", "SIM"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"src/prescriptxai/cli.py" = ["B008"]
"scripts/**" = ["D", "E501", "ANN"]
"hatch_build.py" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["prescriptxai"]
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["numpy.*", "scipy.*", "sklearn.*", "plotly.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["joblib"]
ignore_missing_imports = true
