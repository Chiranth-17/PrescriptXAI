services:
  api:
    build: .
    image: prescriptxai:0.2.0
    environment:
      PRESCRIPTXAI_API__HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${PRESCRIPTXAI_WORKSPACE:-.}/configs:/work/configs:ro
      - ${PRESCRIPTXAI_WORKSPACE:-.}/artifacts:/work/artifacts:ro
      - ${PRESCRIPTXAI_WORKSPACE:-.}/data:/work/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=8)"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 4
  dashboard:
    image: prescriptxai:0.2.0
    build: .
    command: ["prescriptxai", "dashboard", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ${PRESCRIPTXAI_WORKSPACE:-.}/configs:/work/configs:ro
      - ${PRESCRIPTXAI_WORKSPACE:-.}/artifacts:/work/artifacts:ro
      - ${PRESCRIPTXAI_WORKSPACE:-.}/data:/work/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=8)"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 4
